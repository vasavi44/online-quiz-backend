# Application & Server Port (dynamic port for Render deployment)
spring.application.name=online-quiz-application
server.port=${PORT:8080}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# DataSource Environment Overrides (Render PostgreSQL / Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:online-quiz-application-super-secure-jwt-secret-key-32-chars-long!}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
